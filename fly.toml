# fly.toml app configuration file for Solinteg Battery SOC Monitor
# Documentation: https://fly.io/docs/reference/configuration/

app = 'solinteg-boson-ufo5iw'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

# NOTE: NO [http_service] block!
# Because this is a 24/7 background worker (not a website),
# removing [http_service] prevents Fly.io from trying to route web traffic 
# or automatically stopping/sleeping the machine.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
