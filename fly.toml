# fly.toml app configuration file for Solinteg Battery SOC Monitor
# Documentation: https://fly.io/docs/reference/configuration/

app = 'solinteg-boson-sgpksg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

# NO [http_service] block here! 
# This tells Fly.io it is a 24/7 background worker, so:
# 1. Fly will NOT stop or sleep the machine
# 2. Fly will NOT try to proxy web requests to it

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
